<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyMap — Login & Register</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 36px 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-brand">
    <div class="brand-icon" style="width: 50px; height: 50px; font-size: 26px; margin-bottom: 12px;">M</div>
    <h2 class="brand-title" style="font-size: 1.6rem;">MoneyMap</h2>
    <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">Personal Finance Intelligence Platform</p>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
    <button class="auth-tab" onclick="switchTab('register')">Register</button>
  </div>

  <!-- Sign In Form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
    </div>
    <div id="loginError" class="alert alert-danger" style="display: none; margin-bottom: 16px; font-size: 0.85rem; padding: 10px; border-radius: 6px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;"></div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
  </form>

  <!-- Register Form -->
  <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" class="form-control" required placeholder="Full Name">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="regPhone" class="form-control" placeholder="+91 98765 43210">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" class="form-control" required placeholder="Create secure password">
    </div>
    <div id="registerError" class="alert alert-danger" style="display: none; margin-bottom: 16px; font-size: 0.85rem; padding: 10px; border-radius: 6px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;"></div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
  </form>
</div>

<script src="js/api.js"></script>
<script>
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    const err = document.getElementById('loginError');
    if (err) err.style.display = 'none';
    const regErr = document.getElementById('registerError');
    if (regErr) regErr.style.display = 'none';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = 'none';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const res = await API.login(email, password);
    if (res && res.success && res.data) {
      const user = res.data;
      API.setCurrentUser(user);
      if (user.role === 'ADMIN' || user.role === 'SUPER_ADMIN') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    } else {
      errorDiv.textContent = (res && res.error) ? res.error : 'Invalid email or password';
      errorDiv.style.display = 'block';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const errorDiv = document.getElementById('registerError');
    errorDiv.style.display = 'none';

    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;

    const res = await API.register(name, email, phone, password);
    if (res && res.success && res.data) {
      const user = res.data;
      API.setCurrentUser(user);
      alert(`🎉 Registration Successful!\n\nWelcome to MoneyMap, ${user.name}!`);
      window.location.href = 'dashboard.html';
    } else {
      errorDiv.textContent = (res && res.error) ? res.error : 'Registration failed. Please check your details.';
      errorDiv.style.display = 'block';
    }
  }
</script>
</body>
</html>
